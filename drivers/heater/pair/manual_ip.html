<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Stone Connect — Heater IP</title>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="pair.manual_ip.title">Enter heater IP</h1>
    <p class="homey-subtitle" data-i18n="pair.manual_ip.subtitle">
      Find the heater's IP in your router's DHCP lease list.
    </p>
  </header>

  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-label" for="host">IP address</label>
      <input id="host" class="homey-form-input" type="text" placeholder="192.168.1.50" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="port">Port</label>
      <input id="port" class="homey-form-input" type="number" min="1" max="65535" value="443" />
    </div>
  </fieldset>

  <p id="error" style="color:#e74c3c; display:none;"></p>

  <button id="continue" class="homey-button-primary-full">Connect</button>

  <script>
    const hostInput = document.getElementById('host');
    const portInput = document.getElementById('port');
    const button = document.getElementById('continue');
    const errorEl = document.getElementById('error');

    hostInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
    portInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
    button.addEventListener('click', submit);

    function submit() {
      const host = hostInput.value.trim();
      const port = parseInt(portInput.value, 10) || 443;
      if (!host) {
        showError('Please enter an IP address.');
        return;
      }
      errorEl.style.display = 'none';
      button.disabled = true;
      Homey.showLoadingOverlay();

      Homey.emit('ip_entered', { host, port }, (err) => {
        Homey.hideLoadingOverlay();
        button.disabled = false;
        if (err) {
          showError((err && err.message) || String(err));
        } else {
          Homey.showView('list_devices');
        }
      });
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
  </script>
</body>
</html>
